name: Sync Codeberg Profile to GitHub
on:
  push:
    branches: [ main ]
    
  # Allow on-demand trigger.
  workflow_dispatch:
  
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite links and update GitHub profile README
        run: |
          mkdir -p profile
          sed 's|https://codeberg.org|https://github.com|g' README.md > profile/README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git checkout main
          git add profile/README.md
          git commit -m "chore: sync profile README from Codeberg" || exit 0
          git push origin main
